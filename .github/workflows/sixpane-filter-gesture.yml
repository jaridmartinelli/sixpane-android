name: SIXPANE filtered tabs user gesture smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/sixpane-filter-gesture.yml'
jobs:
  filtered-tabs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile filtered tab test
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tap actual filter and tabs on clean emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            gradle --project-dir "$GITHUB_WORKSPACE/android" --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.sixpane.app.FilteredTabsInstrumentedTest
            status=$?
            mkdir -p "$GITHUB_WORKSPACE/filter-evidence"
            timeout 12s adb pull /sdcard/Android/data/com.sixpane.app.preview.filterpages/files/filtered-14.png "$GITHUB_WORKSPACE/filter-evidence/filtered-14.png" || true
            timeout 12s adb exec-out screencap -p > "$GITHUB_WORKSPACE/filter-evidence/final-screen.png" || true
            exit "$status"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sixpane-filtered-tabs-emulator-evidence
          if-no-files-found: warn
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            filter-evidence/
