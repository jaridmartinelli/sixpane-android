name: SIXPANE Tessera UI canonical preview
on:
  push:
    branches: ['feature/tessera-ui-20261107']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Canonical signing identity
        shell: bash
        env:
          SIXPANE_KEYSTORE_BASE64: ${{ secrets.SIXPANE_CANONICAL_KEYSTORE_BASE64 }}
          SIXPANE_CANONICAL_KEYSTORE_PASSWORD: ${{ secrets.SIXPANE_CANONICAL_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIXPANE_KEYSTORE_BASE64"
          test -n "$SIXPANE_CANONICAL_KEYSTORE_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/sixpane-canonical.p12"
          printf '%s' "$SIXPANE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass:env SIXPANE_CANONICAL_KEYSTORE_PASSWORD -alias sixpane-canonical >/dev/null
          echo "SIXPANE_CANONICAL_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Compile tests and canonical preview APK
        working-directory: android
        env:
          SIXPANE_CANONICAL_KEYSTORE_PASSWORD: ${{ secrets.SIXPANE_CANONICAL_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify package, certificate and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.sixpane.app.preview.filterview' versionCode='15'"
          CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          test "${CERT,,}" = 'cced8806d97502e5a7cf950e57c2a82ece12da9c0a0b68cdaca1c03dc0238853'
          sha256sum "$APK" > android/app/build/outputs/apk/debug/app-debug.sha256
      - name: Publish canonical Tessera preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIXPANE-TESSERA-CANONICAL-PREVIEW
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.sha256
            android/app/build/reports/**
            android/app/build/test-results/**
