name: SIXPANE UA A/B QA APK (separate package)
on:
  push:
    branches:
      - qa/webview-wv-ab-20261107
permissions:
  contents: read

jobs:
  qa-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build isolated QA APK and execute JVM tests
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testQaUnitTest :app:assembleQa
      - name: Verify package identity and APK signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          APK='android/app/build/outputs/apk/qa/app-qa.apk'
          test -s "$APK" || { echo "::error::QA APK missing"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee qa-evidence/badging.txt
          grep -Fq "package: name='com.sixpane.app.qa.wvab' versionCode='15'" qa-evidence/badging.txt || { echo "::error::Unexpected QA package ID/version"; exit 1; }
          grep -Fq "application-label:'SIXPANE UA QA'" qa-evidence/badging.txt || { echo "::error::Unexpected QA application label"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee qa-evidence/signature.txt
          unzip -t "$APK" > qa-evidence/zip-integrity.txt
          sha256sum "$APK" | tee qa-evidence/sha256.txt
      - name: Upload verified disposable QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIXPANE-UA-AB-QA
          if-no-files-found: error
          retention-days: 14
          path: android/app/build/outputs/apk/qa/app-qa.apk
      - name: Upload QA verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIXPANE-UA-AB-QA-REPORTS
          if-no-files-found: warn
          retention-days: 14
          path: |
            qa-evidence/**
            android/app/build/reports/tests/**
            android/app/build/test-results/**
