name: SIXPANE Canonical Android APK (main)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'results/harness_regression.cjs'
      - '.github/workflows/sixpane-debug-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'results/harness_regression.cjs'
      - '.github/workflows/sixpane-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Harness logic regression (simulated storage and time)
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/sixpane-harness-test" --no-package-lock --no-save fake-indexeddb@6.0.0
          NODE_PATH="$RUNNER_TEMP/sixpane-harness-test/node_modules" node results/harness_regression.cjs
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android platform using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKM"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify WebView native pinch and no zoom controls
        shell: bash
        run: |
          set -euo pipefail
          PANE='android/app/src/main/java/com/sixpane/app/PaneCard.kt'
          MENU='android/app/src/main/java/com/sixpane/app/WindowActions.kt'
          grep -Fq 'setSupportZoom(true)' "$PANE"
          grep -Fq 'builtInZoomControls=true;displayZoomControls=false' "$PANE"
          if grep -En 'zoomControls\(|Zoom in 10 percent|Zoom out 10 percent|val labels=.*"Zoom"' "$MENU"; then
            echo 'Manual zoom controls unexpectedly present'; exit 1
          fi
      - name: Check native text selection is not hijacked by pane long presses
        shell: bash
        run: |
          set -euo pipefail
          PANE='android/app/src/main/java/com/sixpane/app/PaneCard.kt'
          if grep -En '(fresh|body|webView|selectionLayer)\.setOnLongClickListener' "$PANE"; then
            echo 'Web content or full-pane overlay is intercepting long presses'; exit 1
          fi
          grep -Fq 'setOnLongClickListener{host.windowContextMenu(this@PaneCard);true}' "$PANE"
          grep -Fq 'contentDescription="Window controls: long press number"' "$PANE"
      - name: Check genuine WebView UA is not overridden
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='*.kt' -En 'DESKTOP_USER_AGENT|Windows NT 10\.0|userAgentString[[:space:]]*=' android/app/src/main/java; then
            echo 'Unexpected Android WebView User-Agent override'; exit 1
          fi
      - name: Confirm canonical identity and restored features
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".preview.filterview"' android/app/build.gradle.kts
          grep -Fq 'versionCode = 15' android/app/build.gradle.kts
          grep -Fq 'newUniquePanes(ids)' android/app/src/main/java/com/sixpane/app/LocalStore.kt
          grep -Fq 'replacePanesAcrossWorkspaces' android/app/src/main/java/com/sixpane/app/LocalStore.kt
          grep -Fq 'fun copyPanePageReport(card:PaneCard)' android/app/src/main/java/com/sixpane/app/MainActivity.kt
          grep -Fq 'Copy page report' android/app/src/main/java/com/sixpane/app/WindowActions.kt
          grep -Fq 'if (focusedUrl == "about:blank") "" else focusedUrl' android/app/src/main/java/com/sixpane/app/UniversalBar.kt
          grep -Fq 'repeat(WorkspacePolicy.MAX_WORKSPACES)' android/app/src/main/java/com/sixpane/app/MainActivity.kt
      - name: Load permanent canonical signing key (main only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SIXPANE_KEYSTORE_BASE64: ${{ secrets.SIXPANE_CANONICAL_KEYSTORE_BASE64 }}
          SIXPANE_CANONICAL_KEYSTORE_PASSWORD: ${{ secrets.SIXPANE_CANONICAL_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SIXPANE_KEYSTORE_BASE64:-}" || -z "${SIXPANE_CANONICAL_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::Permanent SIXPANE signing credentials are missing. Configure repository Actions secrets SIXPANE_CANONICAL_KEYSTORE_BASE64 and SIXPANE_CANONICAL_KEYSTORE_PASSWORD. No APK published."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/sixpane-canonical.p12"
          printf '%s' "$SIXPANE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass:env SIXPANE_CANONICAL_KEYSTORE_PASSWORD -alias sixpane-canonical >/dev/null
          echo "SIXPANE_CANONICAL_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Compile tests and debug APK
        working-directory: android
        env:
          SIXPANE_CANONICAL_KEYSTORE_PASSWORD: ${{ secrets.SIXPANE_CANONICAL_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify compiled APK package/version/label
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='com.sixpane.app.preview.filterview' versionCode='15'"
          echo "$BADGING" | grep -Fq "application-label:'SIXPANE'"
      # A main-branch APK is distributable only if signed by the permanent key,
      # whose certificate is pinned here (public SHA-256, NOT a private secret).
      - name: Block unapproved signing certificates from release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          EXPECTED_SIGNER: cced8806d97502e5a7cf950e57c2a82ece12da9c0a0b68cdaca1c03dc0238853
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_SIGNER" ]]; then
            echo "::error::SIXPANE canonical signing identity is not configured. No APK may be published until an authorized permanent keystore and certificate are established."
            exit 1
          fi
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          ACTUAL_SIGNER="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          if [[ -z "$ACTUAL_SIGNER" || "${ACTUAL_SIGNER,,}" != "${EXPECTED_SIGNER,,}" ]]; then
            echo "::error::Permanent SIXPANE signing certificate mismatch. Refusing to publish. Do not rotate the permanent key or package ID."
            exit 1
          fi
      - name: Upload APK and build reports
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SIXPANE-CANONICAL-APK-main
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/**
            android/app/build/test-results/**

# Instrumentation runs independently of the canonical APK signing/publishing job.
  # Use macOS hardware virtualization to avoid root/sudo KVM setup.
  instrumentation:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug app and instrumentation APK
        id: instrumentation_apks
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify generated instrumentation APK manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emulator-evidence
          TEST_APK='android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
          BADGING='emulator-evidence/instrumentation-manifest.txt'
          XMLTREE='emulator-evidence/instrumentation-manifest-xmltree.txt'
          INSTRUMENTATION='emulator-evidence/instrumentation-declaration.txt'
          test -s "$TEST_APK" || { echo "::error::Instrumentation APK missing or empty: $TEST_APK"; exit 1; }
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$TEST_APK" > "$BADGING"
          "$AAPT" dump xmltree "$TEST_APK" AndroidManifest.xml > "$XMLTREE"
          # aapt badging includes the package but not necessarily the instrumentation element.
          # Extract that element and its attributes from the compiled manifest tree.
          awk '
            /^[[:space:]]*E: instrumentation([[:space:]]|$)/ { inside=1; print; next }
            inside && /^[[:space:]]*E: / { exit }
            inside { print }
          ' "$XMLTREE" > "$INSTRUMENTATION"
          check_manifest() {
            local description="$1" source="$2" expected="$3"
            if grep -Fq -- "$expected" "$source"; then
              echo "PASS: $description"
            else
              echo "::error title=Instrumentation manifest mismatch::FAIL: $description (expected: $expected)"
              echo "APK package record:"
              grep '^package:' "$BADGING" || true
              echo "Instrumentation manifest element:"
              cat "$INSTRUMENTATION"
              return 1
            fi
          }
          check_manifest "Test APK package" "$BADGING" "package: name='com.sixpane.app.preview.filterview.test'"
          check_manifest "Instrumentation element" "$INSTRUMENTATION" 'E: instrumentation'
          check_manifest "JUnit runner" "$INSTRUMENTATION" 'android:name(0x01010003)="androidx.test.runner.AndroidJUnitRunner"'
          check_manifest "Target application" "$INSTRUMENTATION" 'android:targetPackage(0x01010021)="com.sixpane.app.preview.filterview"'
      - name: Run Android instrumentation on disposable API 35 emulator
        # The manifest guard is diagnostic; a failing guard must not skip real device tests.
        if: ${{ always() && steps.instrumentation_apks.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --project-dir "$GITHUB_WORKSPACE/android" --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Upload Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIXPANE-INSTRUMENTATION-API35
          if-no-files-found: warn
          retention-days: 14
          path: |
            emulator-evidence/
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
