name: Tessera (new app) build + device tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'tessera/**'
      - '.github/workflows/tessera.yml'

permissions:
  contents: read

# A newer push supersedes an older run, so two runs never race to commit evidence.
concurrency:
  group: tessera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 35
        run: |
          set -euo pipefail
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests, lint, APK
        run: gradle --no-daemon -p tessera :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APK identity and signer
        run: |
          set -euo pipefail
          APK=tessera/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt2" dump badging "$APK" | head -3 | tee apk-badging.txt
          grep -q "package: name='app.tessera.browser'" apk-badging.txt
          "$BT/apksigner" verify --print-certs "$APK" | tee apk-signer.txt
          grep -qi "SHA-256 digest: 46f564b80db697eb298d9a62762ce9b108daf7c9fd27787053267d9807b15b02" apk-signer.txt
          mkdir -p dist && cp "$APK" dist/Tessera-debug.apk
          sha256sum dist/Tessera-debug.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Tessera-APK
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tessera-reports
          if-no-files-found: ignore
          path: |
            tessera/app/build/reports/**
            tessera/app/build/test-results/**

  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile app and device tests
        run: gradle --no-daemon -p tessera :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 42-session isolation, background keep-alive, UI screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tessera/ci_emulator.sh
      - name: Commit downscaled screenshots to this branch for review
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/tessera && rm -f ci-evidence/tessera/*.jpg ci-evidence/tessera/*.apk ci-evidence/tessera/*.sha256
          python3 -m pip install --quiet pillow
          python3 - <<'PYEOF'
          import glob, os
          from PIL import Image
          for f in sorted(glob.glob("tessera-evidence/shots/*.png")):
              im = Image.open(f).convert("RGB")
              im.thumbnail((540, 2000))
              im.save("ci-evidence/tessera/" + os.path.basename(f)[:-4] + ".jpg", quality=72)
          PYEOF
          git config user.name "tessera-ci"; git config user.email "tessera-ci@users.noreply.github.com"
          APK=tessera/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" ci-evidence/tessera/Tessera-debug.apk
          (cd ci-evidence/tessera && sha256sum Tessera-debug.apk > Tessera-debug.apk.sha256 && cat Tessera-debug.apk.sha256)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | tee ci-evidence/tessera/signer.txt || true
          git add ci-evidence/tessera
          git diff --cached --quiet && exit 0
          git commit -m "CI: Tessera emulator screenshots for ${GITHUB_SHA::7} [skip ci]"
          # If another commit landed meanwhile, keep THIS run's evidence files.
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tessera-device-evidence
          if-no-files-found: warn
          path: |
            tessera-evidence/**
            tessera/app/build/outputs/androidTest-results/**
            tessera/app/build/reports/androidTests/**
