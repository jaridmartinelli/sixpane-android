name: SIXPANE clean-emulator user journey
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/sixpane-emulator-journey.yml'
jobs:
  emulator-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android instrumentation tests before launching emulator
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and execute actual user-gesture tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            mkdir -p "$GITHUB_WORKSPACE/emulator-evidence"
            timeout 12s adb shell dumpsys webviewupdate > "$GITHUB_WORKSPACE/emulator-evidence/webview.txt" 2>&1 || true
            cd "$GITHUB_WORKSPACE/android"
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
            status=$?
            cd "$GITHUB_WORKSPACE"
            # Capture while emulator is still running. Never wait indefinitely for adb.
            timeout 12s adb exec-out screencap -p > emulator-evidence/final-screen.png 2>/dev/null || true
            timeout 12s adb logcat -d -t 4000 > emulator-evidence/logcat.txt 2>&1 || true
            timeout 12s adb pull /sdcard/Android/data/com.sixpane.app.preview.compat/files/sixpane-user-journey.png emulator-evidence/user-journey.png 2>&1 || true
            exit "$status"
      - name: Save device-side observations
        if: always()
        run: |
          mkdir -p emulator-evidence
          find android/app/build/outputs/androidTest-results -type f -name '*.xml' -exec cp --parents {} emulator-evidence/ \; 2>/dev/null || true
          find android/app/build/reports/androidTests -type f -exec cp --parents {} emulator-evidence/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sixpane-clean-emulator-evidence
          if-no-files-found: warn
          path: emulator-evidence/
