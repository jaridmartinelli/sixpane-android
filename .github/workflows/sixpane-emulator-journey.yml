name: SIXPANE clean-emulator user journey
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'tests/run_emulator_smoke.sh'
      - '.github/workflows/sixpane-emulator-journey.yml'
jobs:
  emulator-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android instrumentation tests before launching emulator
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and execute actual user-gesture tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/tests/run_emulator_smoke.sh"
      - name: Save device-side observations
        if: always()
        run: |
          mkdir -p emulator-evidence
          find android/app/build/outputs/androidTest-results -type f -name '*.xml' -exec cp --parents {} emulator-evidence/ \; 2>/dev/null || true
          find android/app/build/reports/androidTests -type f -exec cp --parents {} emulator-evidence/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sixpane-clean-emulator-evidence
          if-no-files-found: warn
          path: emulator-evidence/
