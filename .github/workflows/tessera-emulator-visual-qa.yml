name: SIXPANE Tessera emulator + reference-layout capture (feature only)
on:
  push:
    branches: ['feature/tessera-ui-20261107']
    paths:
      - '.github/workflows/tessera-emulator-visual-qa.yml'
      - 'tests/tessera_emulator_visual_capture.sh'
      - 'android/app/src/androidTest/java/com/sixpane/app/TesseraSelectionInstrumentedTest.kt'
      - 'android/app/src/androidTest/java/com/sixpane/app/TesseraLayoutInstrumentedTest.kt'
      - 'android/app/src/androidTest/java/com/sixpane/app/TesseraPopupInstrumentedTest.kt'
      - 'android/app/src/androidTest/java/com/sixpane/app/TesseraJourneysInstrumentedTest.kt'
      - 'android/app/src/main/java/com/sixpane/app/MainActivity.kt'
      - 'android/app/src/main/java/com/sixpane/app/TesseraBar.kt'
      - 'android/app/src/main/java/com/sixpane/app/PaneCard.kt'
      - 'android/app/src/main/java/com/sixpane/app/CookieEditor.kt'
      - 'android/app/src/main/java/com/sixpane/app/LocalStore.kt'
      - 'android/app/src/main/java/com/sixpane/app/WorkspacePolicy.kt'
  workflow_dispatch:
concurrency:
  group: tessera-emulator-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tessera-emulator-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable hardware acceleration for isolated emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 15 emulator, capture UI, and run instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 4
          script: bash "$GITHUB_WORKSPACE/tests/tessera_emulator_visual_capture.sh"
      - name: Upload complete screenshots, hierarchy, tests, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIXPANE-TESSERA-EMULATOR-VISUAL-QA
          path: emulator-evidence/
          if-no-files-found: warn
